[build]
  command = "python3 scripts/build_static.py"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://bshxiuzdqlqezqsrybtn.supabase.co/functions/v1/kate-api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self' https://www.viator.com https://viator.com; base-uri 'none'; frame-ancestors 'none'; object-src 'none'"

[[headers]]
  for = "/build.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/resources/safari-booking-checklist.txt"
  [headers.values]
    Content-Disposition = 'attachment; filename="safari-booking-checklist.txt"'
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
