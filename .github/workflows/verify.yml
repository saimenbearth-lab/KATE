name: Verify KATE
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Python compatibility and production build tests
        run: python3 -m unittest discover -s tests -v
      - name: Edge API and supplier behavior
        run: node --test tests/*.mjs
      - name: Production static build
        env:
          COMMIT: ${{ github.sha }}
        run: python3 scripts/build_static.py
